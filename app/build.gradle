plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13.2'

}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'edu.teamrocket.gallerygrub.App'
}

// --- CONFIGURACIÓN NATIVA PARA GENERAR EL FAT JAR ---
jar {
    manifest {
        attributes 'Main-Class'          : application.mainClass.get(),
                   'Package-Title'       : 'gallery-grub',
                   'Package-Version'     : '1.0',
                   'Package-Vendor'      : 'xiiangomezz@gmail.com',
                   'Specification-Title' : 'gallery-grub'
    }

    // Incluye de forma segura Guava y todas las librerías necesarias en tiempo de ejecución
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Evita errores de archivos duplicados de las librerías de terceros (como las licencias de Guava)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}